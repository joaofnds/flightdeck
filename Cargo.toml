[workspace]
members = ["collector", "model", "persistence", "persister", "tidy", "viewer"]
resolver = "3"

[workspace.dependencies.polars]
git = "https://github.com/pola-rs/polars"
rev = "22a147de3d2bb2e44b97338a2510816c7105c9f2"
default-features = false
features = ["lazy", "parquet", "sql", "dtype-u8", "dtype-u16"]

[workspace.dependencies.polars-parquet]
git = "https://github.com/pola-rs/polars"
rev = "22a147de3d2bb2e44b97338a2510816c7105c9f2"
default-features = false

[patch.crates-io.hashbrown]
git = "https://github.com/pola-rs/hashbrown"
rev = "d76a6f81abd8f388676aff15068236a8d21c7e1a"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Tiger Style splits a compound condition into nested `if` and an `else if` chain into
# `else { if }`, which these two lints would collapse again.
collapsible_if = "allow"
collapsible_else_if = "allow"
# Tiger Style handles every error and converts no integer with `as`, tests included.
as_conversions = "warn"
unwrap_used = "warn"
expect_used = "warn"
let_underscore_untyped = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"

# Optimized dependencies keep the native engine's debug unwind tables within Mach-O limits.
[profile.dev.package."*"]
opt-level = 1
# Nobody steps through a dependency, and its debug info made the native engine's core
# library ten times its release size.
debug = false

# Tiger Style keeps assertions on in production, so overflow traps and a panic aborts.
[profile.release]
overflow-checks = true
panic = "abort"
