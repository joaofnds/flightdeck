[package]
name = "flightdeck"
version = "0.1.0"
edition = "2024"
publish = false

# Keep UI dependencies in a separate lockfile from the recording workspace.
[workspace]

[patch.crates-io.hashbrown]
git = "https://github.com/pola-rs/hashbrown"
rev = "d76a6f81abd8f388676aff15068236a8d21c7e1a"

[dependencies]
collector = { path = "../collector" }
persistence = { path = "../persistence" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
viewer = { path = "../viewer" }
core-foundation = "=0.10.0"
libc = "0.2"
log = "0.4"
image = "=0.25.10"
num-traits = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[dependencies.objc2-app-kit]
version = "0.3.2"
default-features = false
features = [
    "std",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSEvent",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "objc2-core-foundation",
]

[dev-dependencies.gpui]
git = "https://github.com/zed-industries/zed"
rev = "56934ec0560bce8929025497411de7f5322fb6ca"
default-features = false
features = ["test-support"]

[dependencies.gpui]
git = "https://github.com/zed-industries/zed"
rev = "56934ec0560bce8929025497411de7f5322fb6ca"
default-features = false

[dependencies.gpui_macos]
git = "https://github.com/zed-industries/zed"
rev = "56934ec0560bce8929025497411de7f5322fb6ca"
default-features = false
features = ["font-kit", "runtime_shaders"]

[features]
automation = ["gpui/test-support", "gpui_macos/test-support"]

# Keep the native query engine's debug unwind tables within Mach-O limits.
[profile.dev.package."*"]
opt-level = 1
# Nobody steps through a dependency, and its debug info made the native engine's core
# library ten times its release size.
debug = false

[profile.release]
overflow-checks = true
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
as_conversions = "warn"
unwrap_used = "warn"
expect_used = "warn"
collapsible_if = "allow"
collapsible_else_if = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
