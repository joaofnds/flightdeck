name: check

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request makes the older run's verdict moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The collector reads macOS kernel interfaces and frameworks, so it builds only on macOS.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Pinned, so that a newer clippy never refuses code that passed before. Move it forward
      # in a commit of its own, together with the fixes the newer lints ask for.
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Named, since rustup installs the active toolchain without the components asked for
      # when the command names no toolchain.
      - run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN"
          --profile minimal --component rustfmt,clippy --no-self-update
      # Only main saves, so a branch starts from main's build and never evicts it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Installs only just, at the version mise.toml pins, so CI runs the justfile's recipes
      # with the just a contributor runs them with.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.3
          install_args: just
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - run: just fmt
      - run: just clippy
      # The runner is a virtual machine with no SMC, no IOReport channels, no power manager, no
      # Apple GPU driver, one core cluster and energy counters that read 0. The tests whose subject
      # is what those give sit in a module named this_mac beside the tests of the code that reads
      # them, and run only on a Mac, so the check skips every test whose path holds ::this_mac::. A
      # test that needs a second user, which the runner's sudo gives without a password and a
      # contributor's machine does not, is ignored elsewhere, and --include-ignored runs it here
      # under whatever name it takes. It fails, rather than skips, where sudo asks for a password.
      # The runner's disks fail every scan, and the collector reports each failure on stderr.
      # Captured output grows a buffer the allocation tests count against the collector, so
      # --no-capture writes it to stderr as the collector does in production.
      - run: >-
          just test --include-ignored --no-capture --skip ::this_mac::
      # A lock file left in Application Support names a ring that stays in memory after its
      # writer exits, about 800 MB of address space, so whatever ran above removes both.
      - name: Refuse ring lock files left in Application Support
        run: '! find "$HOME/Library/Application Support/Flightdeck" -name "*.lock" | grep .'
  desktop:
    # Build the GPUI desktop client with its separate UI dependency lockfile.
    runs-on: macos-26
    # Cold, this job reaches the app's own check after 26 minutes, with two release builds
    # of Polars still ahead of it, one for the helpers and one for the app.
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN"
          --profile minimal --component rustfmt,clippy --no-self-update
      # Both workspaces compile into the root target, as .cargo/config.toml sets build-dir, and
      # the action deletes from a listed workspace's target every crate that workspace does not
      # name. The desktop workspace names every crate the root one takes from crates.io, so list
      # it alone.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop -> ../target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Installs only just, at the version mise.toml pins, so CI runs the justfile's recipes
      # with the just a contributor runs them with.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.3
          install_args: just
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - run: just desktop-fmt
      - run: just desktop-clippy
      - run: just desktop-test
      # A lock file left in Application Support names a ring that stays in memory after its
      # writer exits, about 800 MB of address space, so whatever ran above removes both.
      - name: Refuse ring lock files left in Application Support
        run: '! find "$HOME/Library/Application Support/Flightdeck" -name "*.lock" | grep .'
      - run: just bundle
      - run: just seal-bench
