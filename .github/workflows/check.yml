name: check

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request makes the older run's verdict moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned, so that a newer clippy never refuses code that passed before. Move it forward
  # in a commit of its own, together with the fixes the newer lints ask for.
  RUSTUP_TOOLCHAIN: 1.98.0
  # The runner is a virtual machine with no SMC, no IOReport channels, no power manager, no
  # Apple GPU driver, one core cluster and energy counters that read 0. The tests whose subject
  # is what those give sit in a module named this_mac beside the tests of the code that reads
  # them, and run only on a Mac, so the check skips every test whose path holds ::this_mac::. A
  # test that needs a second user, which the runner's sudo gives without a password and a
  # contributor's machine does not, is ignored elsewhere, and --include-ignored runs it here
  # under whatever name it takes. It fails, rather than skips, where sudo asks for a password.
  # The runner's disks fail every scan, and the collector reports each failure on stderr.
  # Captured output grows a buffer the allocation tests count against the collector, so
  # --no-capture writes it to stderr as the collector does in production.
  TEST_ARGUMENTS: '--include-ignored --no-capture --skip ::this_mac::'
  # The persistence library's tests that the store-recovery job runs and the persistence job
  # skips, one name a space, so a test runs in exactly one of them whatever these names are.
  STORE_RECOVERY_TESTS: >-
    store::registration_tests::loss_proof_tests::inherited_events_tests
    store::registration_tests::loss_proof_tests::loss_only_tests
    store::registration_tests::loss_proof_tests::ordinary_recovery_tests
    worker::registered::tests::kill_tests

# The root workspace's checks run as four jobs at once, so a push learns its verdict from the
# slowest of them rather than from their sum. The test packages of check and persistence add up to
# the whole workspace by construction, so a new package lands in check, and a new persistence test
# outside the modules store-recovery names lands in persistence.
jobs:
  check:
    # The collector reads macOS kernel interfaces and frameworks, so it builds only on macOS.
    runs-on: macos-26
    # Each job's limit bounds a hung step and is not a measurement of the job. Cold, this one
    # spends 18 minutes on clippy and the two debug builds before its tests. A job that never
    # finishes saves no cache, so a limit below the cold cost would keep every later run cold.
    timeout-minutes: 60
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Named, since rustup installs the active toolchain without the components asked for
      # when the command names no toolchain.
      - &install-toolchain
        run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN"
          --profile minimal --component rustfmt,clippy --no-self-update
      # rust-cache hashes every toolchain rustup lists into its key, and runner images differ in
      # the stable toolchain they carry, so a job that lands on another image builds cold. With
      # only the pinned toolchain left, every image gives one key. The other jobs repeat this
      # step through its anchor.
      - &keep-only-the-pinned-toolchain
        name: Remove every toolchain but the pinned one
        run: |
          for toolchain in $(rustup toolchain list --quiet); do
            if [ "$toolchain" != "$RUSTUP_TOOLCHAIN-aarch64-apple-darwin" ]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done
          [ "$(rustup toolchain list --quiet)" = "$RUSTUP_TOOLCHAIN-aarch64-apple-darwin" ]
      # Only main saves, so a branch starts from main's build and never evicts it. A failed test
      # keeps the build, since otherwise a red job makes every later run of it build cold.
      - &restore-root-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # Installs only just, at the version and the checksum mise.toml and mise.lock pin, so CI
      # runs the justfile's recipes with the just a contributor runs them with. The other jobs
      # repeat this step through its anchor. The hash of that version's macos-arm64 binary lets
      # the action check a mise restored from its cache without fetching the release's checksums
      # from GitHub, so it changes with the version.
      - &install-just
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.3
          sha256: 0999bd4943523ccdbd149b5ad4080281536801b3f6406ac4495699bd0310969c
          install_args: just
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - run: >-
          just test_packages='--workspace --exclude persistence'
          test_arguments="$TEST_ARGUMENTS" check-root
      # A lock file left in Application Support names a ring that stays in memory after its
      # writer exits, about 800 MB of address space, so whatever ran above removes both. It stays
      # out of the justfile, since on a contributor's Mac a running Flightdeck holds its lock
      # there. The other jobs repeat this step through its anchor.
      - &refuse-ring-locks
        name: Refuse ring lock files left in Application Support
        run: '! find "$HOME/Library/Application Support/Flightdeck" -name "*.lock" | grep .'
  persistence:
    # This package's tests start native children that write the most rows the recording retains.
    # Together they took 7.4 and 16.6 minutes on runners a push cannot choose between, on the same
    # code, so they run as this job and store-recovery, which took 3.6 and 7.9 minutes of those.
    runs-on: macos-26
    # Cold, this job builds 13 minutes before its tests. See the check job's limit.
    timeout-minutes: 60
    steps:
      - *checkout
      - *install-toolchain
      - *keep-only-the-pinned-toolchain
      - *restore-root-cache
      - *install-just
      - run: >-
          just test_packages='--package persistence'
          test_arguments="$TEST_ARGUMENTS --skip ${STORE_RECOVERY_TESTS// / --skip }" test
      - *refuse-ring-locks
  store-recovery:
    runs-on: macos-26
    # Cold, this job builds 13 minutes before its tests. See the check job's limit.
    timeout-minutes: 60
    steps:
      - *checkout
      - *install-toolchain
      - *keep-only-the-pinned-toolchain
      # The persistence job's cache, by the key that job gets from its name, since both build the
      # same package and a cache of this job's own would keep another 555 MB for the same build.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: persistence
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - *install-just
      - run: >-
          just test_packages='--package persistence --lib'
          test_arguments="$TEST_ARGUMENTS $STORE_RECOVERY_TESTS" test
      - *refuse-ring-locks
  capacity:
    runs-on: macos-26
    # Cold, this job spends 38 minutes on clippy and two release builds of Polars before its
    # tests. See the check job's limit.
    timeout-minutes: 120
    steps:
      - *checkout
      - *install-toolchain
      - *keep-only-the-pinned-toolchain
      - *restore-root-cache
      - *install-just
      # Full-capacity event fidelity uses the optimized worker and its production deadline.
      - run: just test-event-capacity
      - *refuse-ring-locks
  desktop:
    # Build the GPUI desktop client with its separate UI dependency lockfile.
    runs-on: macos-26
    # Cold, this job reaches the app's own check after 26 minutes, with two release builds
    # of Polars still ahead of it, one for the helpers and one for the app.
    timeout-minutes: 120
    steps:
      - *checkout
      - *install-toolchain
      - *keep-only-the-pinned-toolchain
      # Both workspaces compile into the root target, as .cargo/config.toml sets build-dir, and
      # the action deletes from a listed workspace's target every crate that workspace does not
      # name. The desktop workspace names every crate the root one takes from crates.io, so list
      # it alone.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop -> ../target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - *install-just
      - run: just check-desktop
      - *refuse-ring-locks
      # A release ships the bundle this job built and checked for its commit on main, so no
      # release builds a commit again. An artifact drops the executables' permissions, which
      # ditto keeps, and overwrite lets a rerun of this job replace the bundle of its first run.
      # 90 days is the most the repository allows, and README promises it.
      - name: Archive the bundle for a release
        if: github.ref == 'refs/heads/main'
        run: ditto -c -k --keepParent desktop/target/Flightdeck.app Flightdeck.zip
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: Flightdeck.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 90
          # The zip is compressed already.
          compression-level: 0
