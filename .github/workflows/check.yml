name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The collector reads macOS kernel interfaces and frameworks, so it builds only on macOS.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Pinned, so that a newer clippy never refuses code that passed before. Move it forward
      # in a commit of its own, together with the fixes the newer lints ask for.
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Named, since rustup installs the active toolchain without the components asked for
      # when the command names no toolchain.
      - run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN"
          --profile minimal --component rustfmt,clippy --no-self-update
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- --deny warnings
      # The runner is a virtual machine with no SMC, no IOReport channels and energy counters
      # that read 0, so the tests that read them run only on a Mac. --exact keeps each skip
      # from matching a longer name, so a new test runs here until it is listed. A test that
      # needs a second user, which the runner's sudo gives without a password and a
      # contributor's machine does not, is ignored elsewhere, and --include-ignored runs it
      # here under whatever name it takes. It fails, rather than skips, where sudo asks for a
      # password. The runner's disks fail every scan, and the collector reports each failure
      # on stderr. Captured output grows a buffer the allocation tests count against the
      # collector, so --no-capture writes it to stderr as the collector does in production.
      - run: >-
          cargo test --locked --workspace --no-fail-fast -- --exact --include-ignored --no-capture
          --skip coalitions::tests::counts_the_energy_this_process_spends_in_its_coalition
          --skip ioreport::tests::counts_a_busy_cpu_in_its_cores_active_time
          --skip ioreport::tests::counts_the_energy_the_gpu_spends
          --skip ioreport::tests::counts_time_the_gpu_spends_in_active_states
          --skip ioreport::tests::finds_a_state_left_out_of_active_time_in_every_core_and_the_gpu
          --skip ioreport::tests::learns_only_the_active_states_of_a_core
          --skip ioreport::tests::reads_the_gpus_energy_as_its_counter_holds_it
          --skip ioreport::tests::reads_the_performance_states_of_every_logical_cpu
          --skip ioreport::tests::refuses_a_channel_whose_states_changed_since_open
          --skip ioreport::tests::refuses_a_channel_with_more_active_states_than_its_room
          --skip ioreport::tests::refuses_a_negative_energy_read_from_a_channel
          --skip ioreport::tests::refuses_a_read_that_finds_other_channels_than_open
          --skip ioreport::tests::refuses_more_cores_than_its_cpu_limit
          --skip ioreport::tests::refuses_the_energy_unit_of_a_channel_that_gives_no_energy
          --skip ioreport::tests::refuses_to_learn_a_channel_with_a_negative_state_count
          --skip ioreport::tests::subscribes_only_to_the_channels_a_read_takes
          --skip processes::tests::reads_this_process_spending_energy_while_it_runs
          --skip smc::tests::finds_no_info_for_a_key_the_smc_does_not_hold
          --skip smc::tests::reads_a_speed_for_every_fan
          --skip smc::tests::reads_each_fan_speed_in_rpm
          --skip smc::tests::reads_the_power_the_mac_draws
          --skip smc::tests::reads_the_temperature_of_a_soc_sensor
          --skip smc::tests::refuses_a_float_key_the_smc_holds_as_another_type
          --skip smc::tests::refuses_a_key_read_as_a_type_it_does_not_hold
  desktop:
    # Build the GPUI desktop client with its separate UI dependency lockfile.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN"
          --profile minimal --component rustfmt,clippy --no-self-update
      - run: cargo fmt --manifest-path desktop/Cargo.toml --check
      - run: >-
          cargo clippy --locked --manifest-path desktop/Cargo.toml
          --all-targets -- --deny warnings
      - run: cargo test --locked --manifest-path desktop/Cargo.toml
      - run: >-
          cargo run --locked --manifest-path desktop/Cargo.toml
          --bin flightdeck -- --check
      - run: >-
          cargo run --locked --manifest-path desktop/Cargo.toml
          --bin text_backend_check -- --check
      - run: cargo build --locked --release -p collector -p persistence --bin collector --bin persister
      - run: >-
          cargo build --locked --release --manifest-path desktop/Cargo.toml
          --bin flightdeck
      - name: Record executable identities before packaging
        run: >-
          shasum -a 256 desktop/target/release/flightdeck
          target/release/collector target/release/persister
          > desktop/target/bundle-built.sha256
      - run: desktop/target/release/flightdeck --bundle
      - run: '"desktop/target/Flightdeck.app/Contents/MacOS/flightdeck" --bundle --check'
      - name: Verify packaged executable identities
        run: |
          shasum -a 256 \
            "desktop/target/Flightdeck.app/Contents/MacOS/flightdeck" \
            "desktop/target/Flightdeck.app/Contents/Helpers/collector" \
            "desktop/target/Flightdeck.app/Contents/Helpers/persister" \
            > desktop/target/bundle-packaged.sha256
          cat desktop/target/bundle-built.sha256 desktop/target/bundle-packaged.sha256
          cut -c 1-64 desktop/target/bundle-built.sha256 \
            > desktop/target/bundle-built-digests.sha256
          cut -c 1-64 desktop/target/bundle-packaged.sha256 \
            > desktop/target/bundle-packaged-digests.sha256
          diff -u desktop/target/bundle-built-digests.sha256 \
            desktop/target/bundle-packaged-digests.sha256
      - name: Reject changed packaged helper bytes
        run: |
          cp -R "desktop/target/Flightdeck.app" \
            "desktop/target/Flightdeck tampered.app"
          printf changed >> \
            "desktop/target/Flightdeck tampered.app/Contents/Helpers/collector"
          shasum -a 256 \
            "desktop/target/Flightdeck tampered.app/Contents/MacOS/flightdeck" \
            "desktop/target/Flightdeck tampered.app/Contents/Helpers/collector" \
            "desktop/target/Flightdeck tampered.app/Contents/Helpers/persister" \
            > desktop/target/bundle-tampered.sha256
          cut -c 1-64 desktop/target/bundle-tampered.sha256 \
            > desktop/target/bundle-tampered-digests.sha256
          ! diff -u desktop/target/bundle-built-digests.sha256 \
            desktop/target/bundle-tampered-digests.sha256
