name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The collector reads macOS kernel interfaces and frameworks, so it builds only on macOS.
    runs-on: macos-26
    timeout-minutes: 15
    env:
      # Pinned, so that a newer clippy never refuses code that passed before. Move it forward
      # in a commit of its own, together with the fixes the newer lints ask for.
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Named, since rustup installs the active toolchain without the components asked for
      # when the command names no toolchain.
      - run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN"
          --profile minimal --component rustfmt,clippy --no-self-update
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- --deny warnings
      # The runner is a virtual machine with no SMC, no IOReport channels and energy counters
      # that read 0, so the tests that read them run only on a Mac. --exact keeps each skip
      # from matching a longer name, so a new test runs here until it is listed.
      - run: >-
          cargo test --locked --workspace --no-fail-fast -- --exact
          --skip coalitions::tests::counts_the_energy_this_process_spends_in_its_coalition
          --skip collector::tests::reads_every_listed_coalition_after_a_tick_that_dropped_a_start
          --skip ioreport::tests::counts_a_busy_cpu_in_its_cores_active_time
          --skip ioreport::tests::counts_the_energy_the_gpu_spends
          --skip ioreport::tests::counts_time_the_gpu_spends_in_active_states
          --skip ioreport::tests::finds_a_state_left_out_of_active_time_in_every_core_and_the_gpu
          --skip ioreport::tests::reads_the_performance_states_of_every_logical_cpu
          --skip ioreport::tests::refuses_a_channel_whose_states_changed_since_open
          --skip ioreport::tests::refuses_a_channel_with_more_active_states_than_its_room
          --skip ioreport::tests::refuses_more_cores_than_its_cpu_limit
          --skip processes::tests::reads_this_process_spending_energy_while_it_runs
          --skip smc::tests::reads_a_speed_for_every_fan
          --skip smc::tests::reads_each_fan_speed_in_rpm
          --skip smc::tests::reads_the_power_the_mac_draws
          --skip smc::tests::reads_the_temperature_of_a_soc_sensor
          --skip tests::allocates_nothing_in_a_warm_tick_or_the_reports_it_closes
