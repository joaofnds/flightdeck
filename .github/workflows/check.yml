name: check

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request makes the older run's verdict moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The collector reads macOS kernel interfaces and frameworks, so it builds only on macOS.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Pinned, so that a newer clippy never refuses code that passed before. Move it forward
      # in a commit of its own, together with the fixes the newer lints ask for.
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Named, since rustup installs the active toolchain without the components asked for
      # when the command names no toolchain.
      - run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN"
          --profile minimal --component rustfmt,clippy --no-self-update
      # Only main saves, so a branch starts from main's build and never evicts it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- --deny warnings
      # The runner is a virtual machine with no SMC, no IOReport channels, no power manager, no
      # Apple GPU driver, one core cluster and energy counters that read 0, so the tests that read
      # them run only on a Mac. --exact keeps each skip from matching a longer name, so a new test
      # runs here until it is listed. A test that needs a second user, which the runner's sudo gives
      # without a password and a contributor's machine does not, is ignored elsewhere, and
      # --include-ignored runs it here under whatever name it takes. It fails, rather than skips,
      # where sudo asks for a password. The runner's disks fail every scan, and the collector
      # reports each failure on stderr. Captured output grows a buffer the allocation tests count
      # against the collector, so --no-capture writes it to stderr as the collector does in
      # production.
      - run: >-
          cargo test --locked --workspace --no-fail-fast -- --exact --include-ignored --no-capture
          --skip clock_states::tests::reads_the_tables_of_this_mac
          --skip coalitions::tests::counts_the_energy_this_process_spends_in_its_coalition
          --skip gpu_clients::tests::reads_each_process_once_with_some_gpu_time
          --skip gpu_memory::tests::reads_the_gpu_memory_of_this_mac
          --skip ioreport::tests::hardware::counts_a_busy_cpu_in_its_cores_active_time
          --skip ioreport::tests::hardware::counts_the_energy_the_gpu_spends
          --skip ioreport::tests::hardware::counts_time_the_gpu_spends_in_active_states
          --skip ioreport::tests::hardware::finds_a_state_left_out_of_active_time_in_every_core_and_the_gpu
          --skip ioreport::tests::hardware::reads_the_gpus_energy_as_its_counter_holds_it
          --skip ioreport::tests::hardware::reads_the_performance_states_of_every_logical_cpu
          --skip ioreport::tests::hardware::subscribes_only_to_the_channels_a_read_takes
          --skip machine::tests::reads_the_gpu_core_count_the_registry_reports
          --skip machine::tests::reads_the_logical_cpus_of_each_performance_level_fastest_first
          --skip processes::tests::reads_this_process_spending_energy_while_it_runs
          --skip smc::tests::hardware::finds_no_info_for_a_key_the_smc_does_not_hold
          --skip smc::tests::hardware::reads_each_fan_speed_in_rpm
          --skip smc::tests::hardware::reads_the_power_the_mac_draws
          --skip smc::tests::hardware::reads_the_temperature_of_a_soc_sensor
          --skip smc::tests::hardware::reads_the_temperature_of_the_cpu_and_of_the_gpu
          --skip smc::tests::hardware::refuses_a_float_key_the_smc_holds_as_another_type
          --skip smc::tests::hardware::refuses_a_key_read_as_a_type_it_does_not_hold
          --skip system::tests::reads_the_readings_of_this_mac
      # A lock file left in Application Support names a ring that stays in memory after its
      # writer exits, about 800 MB of address space, so whatever ran above removes both.
      - name: Refuse ring lock files left in Application Support
        run: '! find "$HOME/Library/Application Support/Flightdeck" -name "*.lock" | grep .'
  desktop:
    # Build the GPUI desktop client with its separate UI dependency lockfile.
    runs-on: macos-26
    # Cold, this job reaches the app's own check after 26 minutes, with two release builds
    # of Polars still ahead of it, one for the helpers and one for the app.
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN"
          --profile minimal --component rustfmt,clippy --no-self-update
      # Both workspaces compile into the root target, as .cargo/config.toml sets build-dir, and
      # the action deletes from a listed workspace's target every crate that workspace does not
      # name. The desktop workspace names every crate the root one takes from crates.io, so list
      # it alone.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop -> ../target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path desktop/Cargo.toml --check
      - run: >-
          cargo clippy --locked --manifest-path desktop/Cargo.toml
          --all-targets -- --deny warnings
      # The control socket builds only with the automation feature, so check it here too.
      - run: >-
          cargo clippy --locked --manifest-path desktop/Cargo.toml
          --all-targets --features automation -- --deny warnings
      # Four tests project the CPU page of the Mac they run on, and the runner has one core cluster
      # where they need two, so they run only on a Mac. --exact keeps each skip to its own test.
      - run: >-
          cargo test --locked --manifest-path desktop/Cargo.toml -- --exact
          --skip live_dashboard::input_tests::loading::the_cpu_panels_keep_their_size_side_by_side
          --skip live_dashboard::input_tests::loading::the_cpu_panels_keep_their_size_stacked
          --skip live_dashboard::input_tests::summary::a_wide_cpu_summary_fills_four_equal_tracks
          --skip live_projection::tests::cpu_frequency_charts_each_level_where_measured
      - run: >-
          cargo run --locked --manifest-path desktop/Cargo.toml
          --bin flightdeck -- --check
      - run: >-
          cargo run --locked --manifest-path desktop/Cargo.toml
          --bin text_backend_check -- --check
      # A lock file left in Application Support names a ring that stays in memory after its
      # writer exits, about 800 MB of address space, so whatever ran above removes both.
      - name: Refuse ring lock files left in Application Support
        run: '! find "$HOME/Library/Application Support/Flightdeck" -name "*.lock" | grep .'
      - run: cargo build --locked --release -p collector -p persister --bin collector --bin persister
      - run: >-
          cargo build --locked --release --manifest-path desktop/Cargo.toml
          --bin flightdeck
      - name: Record executable identities before packaging
        run: >-
          shasum -a 256 desktop/target/release/flightdeck
          target/release/collector target/release/persister
          > desktop/target/bundle-built.sha256
      - run: desktop/target/release/flightdeck --bundle
      - run: '"desktop/target/Flightdeck.app/Contents/MacOS/flightdeck" --bundle --check'
      - name: Verify packaged executable identities
        run: |
          shasum -a 256 \
            "desktop/target/Flightdeck.app/Contents/MacOS/flightdeck" \
            "desktop/target/Flightdeck.app/Contents/Helpers/collector" \
            "desktop/target/Flightdeck.app/Contents/Helpers/persister" \
            > desktop/target/bundle-packaged.sha256
          cat desktop/target/bundle-built.sha256 desktop/target/bundle-packaged.sha256
          cut -c 1-64 desktop/target/bundle-built.sha256 \
            > desktop/target/bundle-built-digests.sha256
          cut -c 1-64 desktop/target/bundle-packaged.sha256 \
            > desktop/target/bundle-packaged-digests.sha256
          diff -u desktop/target/bundle-built-digests.sha256 \
            desktop/target/bundle-packaged-digests.sha256
      - name: Reject changed packaged helper bytes
        run: |
          cp -R "desktop/target/Flightdeck.app" \
            "desktop/target/Flightdeck tampered.app"
          printf changed >> \
            "desktop/target/Flightdeck tampered.app/Contents/Helpers/collector"
          shasum -a 256 \
            "desktop/target/Flightdeck tampered.app/Contents/MacOS/flightdeck" \
            "desktop/target/Flightdeck tampered.app/Contents/Helpers/collector" \
            "desktop/target/Flightdeck tampered.app/Contents/Helpers/persister" \
            > desktop/target/bundle-tampered.sha256
          cut -c 1-64 desktop/target/bundle-tampered.sha256 \
            > desktop/target/bundle-tampered-digests.sha256
          ! diff -u desktop/target/bundle-built-digests.sha256 \
            desktop/target/bundle-tampered-digests.sha256
