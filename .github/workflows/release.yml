name: release

# A tag <version> releases the commit it names, where <version> is the one desktop/Info.plist
# gives the app.
on:
  push:
    tags:
      - '[0-9]*'

# A second run for the same tag waits, rather than cancelling one that is halfway through
# uploading.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A release ships only a commit that check passed on main. When main and the tag arrive in one
  # push, check may not have started yet, so the job waits for its run to appear and then to end.
  # A run cancelled by a newer push to main refuses the release too, which a rerun can retry.
  wait-for-check:
    runs-on: ubuntu-latest
    # Check takes 10 to 25 minutes once main's cache is warm, and a cold run that takes longer
    # refuses the release, which a rerun after check ends can retry.
    timeout-minutes: 35
    permissions:
      actions: read
    outputs:
      run-id: ${{ steps.check.outputs.run-id }}
    steps:
      - id: check
        name: Wait for check to pass on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Polls every 30 seconds for 30 minutes, inside the job's limit. A missing run reads
          # as "null null null", and a run that has not ended has an empty conclusion.
          for attempt in $(seq 1 60); do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow check.yml \
              --commit "$GITHUB_SHA" --event push --branch main --limit 1 \
              --json status,conclusion,databaseId \
              --jq '.[0] | "\(.status) \(.conclusion) \(.databaseId)"')"
            state="${run% *}"
            if [ "$state" = "completed success" ]; then
              echo "run-id=${run##* }" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${state%% *}" = "completed" ]; then
              echo "::error::Check on main ended as ${state#* } for $GITHUB_SHA."
              exit 1
            fi
            sleep 30
          done
          if [ "$state" = "null null" ]; then
            echo "::error::Check never ran on main for $GITHUB_SHA."
            exit 1
          fi
          echo "::error::Check on main did not end for $GITHUB_SHA within 30 minutes."
          exit 1

  # The release ships the bundle the desktop job of check built and checked for the tagged
  # commit, so the commit is built once. That job restores main's cache, so the bundle links
  # crates an earlier run on main compiled, which only code that landed on main could have
  # written. Check keeps the bundle 90 days, so a tag on an older commit finds none and fails
  # here.
  check-bundle:
    needs: [wait-for-check]
    # The bundle runs only on macOS, so only a Mac can check it.
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      actions: read
    outputs:
      version: ${{ steps.bundle.outputs.version }}
      archive: ${{ steps.bundle.outputs.archive }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          run-id: ${{ needs.wait-for-check.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Refuses bytes other than those check uploaded, which is also the default.
          digest-mismatch: error
      # The archive, the release and the cask take the version from the tag, and the app shows
      # the one its Info.plist gives, so a tag that names another version is refused. Apple's
      # version is three integers, so it also keeps anything else out of the cask's Ruby.
      - id: bundle
        name: Check the bundle and name it for the release
        run: |
          directory="$(mktemp -d)"
          ditto -x -k Flightdeck.zip "$directory"
          version="$(plutil -extract CFBundleShortVersionString raw \
            "$directory/Flightdeck.app/Contents/Info.plist")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The bundle's version $version is not three integers."
            exit 1
          fi
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME names another version than the bundle's $version."
            exit 1
          fi
          "$directory/Flightdeck.app/Contents/MacOS/flightdeck" --bundle --check
          archive="Flightdeck_${version}_aarch64.zip"
          mv Flightdeck.zip "$archive"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$archive" | cut -c 1-64)" >> "$GITHUB_OUTPUT"
      # The artifact wraps the archive in a zip of its own, which download-artifact extracts, so
      # the publish job receives the archive itself. With archive: false, download-artifact would
      # extract the archive, since it extracts whatever is a zip.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ steps.bundle.outputs.archive }}
          if-no-files-found: error
          # The zip is compressed already.
          compression-level: 0

  # Publishing is a job of its own, so the job that runs the bundle never holds a token that can
  # write the repository.
  publish:
    needs: [check-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      # Given an asset, gh keeps the release a draft until the asset is uploaded, deletes the draft
      # when the upload fails, and refuses a tag that already has a release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ needs.check-bundle.outputs.archive }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" --repo "$GITHUB_REPOSITORY"
          --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  update-tap:
    needs: [check-bundle, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Releases of two tags write the tap one after the other, so neither replaces a cask with a
    # sha the other has just made stale.
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      # The contents API commits each cask as the token's owner, so the job sets no git identity
      # and keeps the token out of a clone's configuration.
      - name: Write the casks to joaofnds/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.check-bundle.outputs.version }}
          ARCHIVE: ${{ needs.check-bundle.outputs.archive }}
          SHA256: ${{ needs.check-bundle.outputs.sha256 }}
        run: |
          # The two casks differ only in their token, so one function writes both. A versioned
          # cask whose contents drift from the unversioned one would install something other
          # than what the same tag serves as latest. Homebrew names only major macOS versions,
          # so the cask admits 14.0 to 14.3, below Info.plist's LSMinimumSystemVersion of 14.4.
          write_cask() {
            cat > "$1" << CASK
          # Generated by joaofnds/flightdeck release workflow. DO NOT EDIT.
          cask "$2" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/joaofnds/flightdeck/releases/download/${VERSION}/${ARCHIVE}"
            name "Flightdeck"
            desc "System monitor that records every second of the machine"
            homepage "https://github.com/joaofnds/flightdeck"

            depends_on arch: :arm64
            depends_on macos: :sonoma

            app "Flightdeck.app"

            postflight_steps do
              run "/usr/bin/xattr", args: ["-cr", "{{appdir}}/Flightdeck.app"]
            end

            zap trash: [
              "~/Library/Application Support/Flightdeck",
              "~/Library/Preferences/dev.flightdeck.desktop.plist",
            ]
          end
          CASK
          }

          listing="$(gh api repos/joaofnds/homebrew-tap/contents/Casks)"
          # Prints the sha of the blob a cask holds in the tap, or nothing for a cask not there.
          tap_sha() {
            jq --raw-output --arg name "$1" '.[] | select(.name == $name) | .sha' <<< "$listing"
          }

          # Updating a file through the contents API takes the sha of the blob it replaces.
          put_cask() {
            sha="$(tap_sha "$1")"
            arguments=(-f "message=Update flightdeck to ${VERSION} in $1"
              -f "content=$(base64 -w 0 < "$1")")
            if [ -n "$sha" ]; then
              arguments+=(-f "sha=$sha")
            fi
            gh api --method PUT "repos/joaofnds/homebrew-tap/contents/Casks/$1" \
              "${arguments[@]}" --silent
          }

          # brew resolves flightdeck@0.2.0 to Casks/flightdeck@0.2.0.rb, so the token inside the
          # file carries the version too, or the name it installs by would not match the name it
          # declares.
          write_cask "flightdeck@${VERSION}.rb" "flightdeck@${VERSION}"
          put_cask "flightdeck@${VERSION}.rb"

          # A tag pushed after a newer one, such as a fix to an older version, keeps its pinned
          # cask and leaves flightdeck.rb on the newer version, so brew upgrade never goes back.
          if [ -n "$(tap_sha flightdeck.rb)" ]; then
            latest="$(gh api repos/joaofnds/homebrew-tap/contents/Casks/flightdeck.rb \
              --jq .content | base64 --decode | sed -n 's/^  version "\(.*\)"$/\1/p')"
            if [ -z "$latest" ]; then
              echo "::error::Casks/flightdeck.rb names no version."
              exit 1
            fi
            newest="$(printf '%s\n%s\n' "$latest" "$VERSION" | sort --version-sort | tail -n 1)"
            if [ "$newest" != "$VERSION" ]; then
              echo "::notice::flightdeck.rb stays on $latest, newer than $VERSION."
              exit 0
            fi
          fi
          write_cask flightdeck.rb flightdeck
          put_cask flightdeck.rb
