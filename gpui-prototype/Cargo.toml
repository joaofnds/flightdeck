[package]
name = "flightdeck-gpui"
version = "0.1.0"
edition = "2024"
publish = false

# Independent experiment: do not alter the recording workspace or its lockfile.
[workspace]

[dependencies]
collector = { path = "../collector" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
viewer = { path = "../viewer" }
core-foundation = "=0.10.0"
libc = "0.2"
log = "0.4"
image = "=0.25.10"
num-traits = "0.2"

[dev-dependencies]
persistence = { path = "../persistence" }

[dev-dependencies.gpui]
git = "https://github.com/zed-industries/zed"
rev = "56934ec0560bce8929025497411de7f5322fb6ca"
default-features = false
features = ["test-support"]

[dependencies.gpui]
git = "https://github.com/zed-industries/zed"
rev = "56934ec0560bce8929025497411de7f5322fb6ca"
default-features = false

[dependencies.gpui_macos]
git = "https://github.com/zed-industries/zed"
rev = "56934ec0560bce8929025497411de7f5322fb6ca"
default-features = false
features = ["font-kit", "runtime_shaders"]

[profile.release]
overflow-checks = true
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
as_conversions = "warn"
unwrap_used = "warn"
expect_used = "warn"
collapsible_if = "allow"
collapsible_else_if = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
