[package]
name = "viewer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
collector = { path = "../collector" }
model = { path = "../model" }
persistence = { path = "../persistence" }
polars = { workspace = true }
serde_json = "=1.0.154"

[features]
# Tests at the full size of a long recording, which take minutes of links and so stay out of the
# checks: `cargo test --locked -p viewer --lib --features long-recording -- registered_tests`.
long-recording = []
# What the live store costs on a recording, which takes a recording to read and minutes of loads
# and so stays out of the checks: `just read-benchmark <a recording>`.
read-benchmark = []

[dev-dependencies]
persistence = { path = "../persistence", features = ["fixtures"] }

[lints]
workspace = true
