# Keep a function to 70 lines, as tidy does, so a reader sees all of it at once. Clippy
# counts only its code lines, and parses the function, so a string holding a line like its
# closing brace cannot cut its count short.
too-many-lines-threshold = 70
# A test may unwrap, and assertions stay on in production, so no `debug_assert!`.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
disallowed-macros = [
    { path = "std::debug_assert", reason = "assertions stay on in production" },
    { path = "std::debug_assert_eq", reason = "assertions stay on in production" },
    { path = "std::debug_assert_ne", reason = "assertions stay on in production" },
]
